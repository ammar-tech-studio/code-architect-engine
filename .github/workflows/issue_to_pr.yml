name: Remote Issue Architect to PR

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build-from-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (github.event.action == 'opened' || github.event.label.name == 'agent-build')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai pyyaml

      - name: Run Issue Architect Agent
        env:
          PYTHONPATH: ${{ github.workspace }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python -m src.agents.issue_architect

      - name: Comment Architectural Plan on Issue
        if: hashFiles('plan_comment.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body-file plan_comment.md
          rm -f plan_comment.md

      - name: Create Branch and Open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          BRANCH=$(cat pr_branch.txt)
          git config user.name "code-architect-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add workspace_outputs/
          rm -f pr_branch.txt
          if git diff --cached --quiet; then
            echo "No files generated."
            exit 0
          fi
          git commit -m "feat(agent): implement issue #${{ github.event.issue.number }} [skip ci]"
          git push -u origin "$BRANCH" --force-with-lease

          if ! gh pr list --head "$BRANCH" --json number --jq 'length' | grep -q '^1$'; then
            gh pr create \
              --title "feat: ${ISSUE_TITLE} (Issue #${{ github.event.issue.number }})" \
              --body-file pr_body.txt \
              --head "$BRANCH" \
              --base "${{ github.event.repository.default_branch }}"
          fi
          rm -f pr_body.txt
